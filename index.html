<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fun with Words</title>
    <style>
      body {
        background-color: #121212;
        color: #fff;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .flashcard-box {
        border: 2px solid #007bff;
        border-radius: 12px;
        padding: 40px 20px;
        background-color: #1e1e1e;
        width: 80%;
        max-width: 320px;
        text-align: center;
      }
      .english-word {
        font-size: 24px;
        margin-bottom: 10px;
        font-weight: bold;
        cursor: pointer;
        color: #007bff;
      }
      .example-sentence {
        font-size: 0.8rem;
        font-style: italic;
        color: #007bff;
        margin-top: -10px;
        margin-bottom: 10px;
      }
      .separator {
        height: 1px;
        background-color: #007bff;
        margin: 15px auto;
        width: 80%;
      }
      .portuguese-button {
        border: 1px solid #007bff;
        border-radius: 12px;
        background-color: transparent;
        font-size: 24px;
        font-weight: bold;
        margin-top: 20px;
        width: 80%;
        height: 50px;
        line-height: 50px;
        color: #007bff;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
        white-space: nowrap;
      }
      .portuguese-button.revealed {
        background-color: #007bff;
        color: #fff;
      }
      .controls {
        margin-top: 60px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button.control-button {
        background-color: #007bff;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
      }
      button.control-button:hover {
        background-color: #0056b3;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 60px;
      }
      @media (max-width: 480px) {
        .english-word,
        .portuguese-button {
          font-size: 6vw;
          height: 12vw;
          line-height: 12vw;
        }
        .example-sentence {
          font-size: 3.5vw;
        }
        button.control-button {
          padding: 2vw 4vw;
          font-size: 5vw;
        }
        h1 {
          font-size: 7vw;
          margin-bottom: 8vw;
        }
      }
    </style>
  </head>
  <body>
    <h1>🇺🇸 Fun with Words 🇧🇷</h1>
    <div class="flashcard-box">
      <div id="english-word" class="english-word">Loading...</div>
      <div id="example-sentence" class="example-sentence"></div>
      <div class="separator"></div>
      <button id="portuguese-button" class="portuguese-button">&nbsp;</button>
    </div>
    <div class="controls">
      <button id="prev" class="control-button">⬅️</button>
      <button id="shuffle" class="control-button">🔀</button>
      <button id="speak" class="control-button">🔊</button>
      <button id="next" class="control-button">➡️</button>
    </div>

    <script>
      const CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzQ3bKLKQeXx1OcHvGouVnwW65gf21xrtTUz8ocvB-rIcATRxjFpcPiy09NSMeGHtDuFXErySPe2Wp/pub?gid=0&single=true&output=csv";

      let flashcards = [];
      let currentIndex = 0;

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      function loadClient() {
        fetch(CSV_URL)
          .then((r) => r.text())
          .then((text) => {
            const rows = text
              .trim()
              .split(/\r?\n/)
              .map((line) => line.split(",").map((cell) => cell.trim()));
            flashcards = rows
              .slice(1)
              .filter((row) => row[0] !== ""); // English word not empty
            shuffleArray(flashcards);
            showFlashcard();
          })
          .catch((err) => {
            console.error(err);
            document.getElementById("english-word").innerText =
              "Error loading flashcards.";
          });
      }

      function showFlashcard() {
        if (!flashcards.length) return;
        const [question, answer, example] = flashcards[currentIndex];

        document.getElementById("english-word").innerText = question;
        document.getElementById("example-sentence").innerText = example || "";
        const porBtn = document.getElementById("portuguese-button");
        porBtn.classList.remove("revealed");
        porBtn.innerHTML = "&nbsp;";
      }

      document
        .getElementById("portuguese-button")
        .addEventListener("click", () => {
          const btn = document.getElementById("portuguese-button");
          btn.innerText = flashcards[currentIndex][1] || "";
          btn.classList.add("revealed");
        });

      document
        .getElementById("english-word")
        .addEventListener("click", () => {
          currentIndex = (currentIndex + 1) % flashcards.length;
          showFlashcard();
        });

      document.getElementById("next").addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % flashcards.length;
        showFlashcard();
      });

      document.getElementById("prev").addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
        showFlashcard();
      });

      document.getElementById("shuffle").addEventListener("click", () => {
        shuffleArray(flashcards);
        currentIndex = 0;
        showFlashcard();
      });

      document.getElementById("speak").addEventListener("click", () => {
        const utter = new SpeechSynthesisUtterance(flashcards[currentIndex][0]);
        const voices = speechSynthesis.getVoices();
        const female = voices.find((v) =>
          /female|samantha|karen/i.test(v.name)
        );
        if (female) utter.voice = female;
        utter.lang = "en-US";
        speechSynthesis.speak(utter);
      });

      loadClient();
    </script>
  </body>
</html>
